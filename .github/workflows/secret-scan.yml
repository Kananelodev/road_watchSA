name: secret-scan

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for exposed API keys
        run: python check_secrets.py
      - name: Guardrail self-test
        run: python guardrails.py
